[project]
name = "blender-pro"
version = "0.1.0"
description = "Ferramentas extras para o MCP do Blender: medir, vistas técnicas, comparar com referência, destacar peças, referências na cena, checkpoint e guia de modelagem realista."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "numpy>=1.26",
    "pillow>=10.1",
]

[tool.uv]
package = false
